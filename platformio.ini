; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:picow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = rpipicow
framework = arduino
lib_deps = arduino-libraries/Ethernet@^2.0.2
build_flags = 
	-DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
	-DMAC_DS3=0xAA,0xBB,0xCC,0xDD,0xEE,0xFF
	-DMAC_PS3=0xAA,0xBB,0xCC,0xDD,0xEE,0xFF
	-DMAC_ETH=0xF4,0x64,0x12,0x00,0x00,0x00
